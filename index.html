<!DOCTYPE html>
<html lang="en">
<!-- Cloudflare Web Analytics -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Cheyla J Tavarez</title>
  <meta id="page-desc" name="description" content="Personal website for Cheyla J Tavarez." />
  <style>
    :root {
      --bg: #f8f5f2;
      --surface: #ffffff;
      --text: #2f2a27;
      --muted: #6b625d;
      --accent: #b57f6d;
      --accent-dark: #8f5f4f;
      --line: #e9dfd8;
      --max: 1120px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    body.ready { opacity: 1; }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(100% - 2rem, var(--max));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(248, 245, 242, 0.88);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      gap: 1rem;
    }

    .brand { font-weight: 700; letter-spacing: 0.04em; }

    .nav-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hero {
      padding: 5rem 0 4rem;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.85rem;
      background: rgba(255,255,255,0.75);
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.05;
      margin: 1rem 0;
    }

    .lead {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 60ch;
    }

    .cta-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.95rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: 0.2s ease;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { border-color: var(--line); background: var(--surface); color: var(--text); }

    .hero-img-wrap {
      border-radius: 28px;
      overflow: hidden;
      min-height: 420px;
      box-shadow: 0 16px 40px rgba(36, 28, 21, 0.10);
    }

    .hero-img {
      width: 100%;
      height: 100%;
      min-height: 420px;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .hero-card {
      background: linear-gradient(180deg, #fff 0%, #f3ece7 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 2rem;
      min-height: 420px;
      display: flex;
      align-items: end;
      box-shadow: 0 16px 40px rgba(36, 28, 21, 0.06);
    }

    .hero-card-inner {
      width: 100%;
      border-top: 1px solid rgba(0,0,0,0.07);
      padding-top: 1rem;
      color: var(--muted);
    }

    section { padding: 4.5rem 0; }

    .section-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin: 0 0 0.75rem;
    }

    .section-copy {
      color: var(--muted);
      max-width: 65ch;
      margin-bottom: 2rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(36, 28, 21, 0.04);
    }

    .card h3 { margin-top: 0; margin-bottom: 0.5rem; font-size: 1.1rem; }
    .card p  { color: var(--muted); margin: 0; }

    .about-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 2rem;
      align-items: start;
    }

    .quote {
      background: #efe6df;
      border-radius: 24px;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.4rem;
      line-height: 1.4;
    }

    .contact-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    form { display: grid; gap: 1rem; }

    input, textarea {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      color: var(--text);
    }

    textarea { min-height: 150px; resize: vertical; }

    /* Card images (focus section) */
    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 1rem;
    }

    /* Post card images */
    .post-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
    }

    .post-links { display: flex; gap: 1rem; flex-wrap: wrap; }

    /* Form feedback */
    .form-status {
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      display: none;
    }
    .form-status.success { display: block; background: #edf7ed; color: #2e6b30; }
    .form-status.error   { display: block; background: #fdecea; color: #8b2020; }

    /* Posts */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(36, 28, 21, 0.04);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .post-meta {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 0.75rem;
    }

    .post-category {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
    }

    .post-title { font-size: 1.15rem; font-weight: 600; margin: 0; }
    .post-body  { color: var(--muted); font-size: 0.95rem; flex: 1; }

    .post-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--accent-dark);
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    footer {
      padding: 2rem 0 3rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    .small { font-size: 0.92rem; color: var(--muted); }

    @media (max-width: 900px) {
      .hero, .about-grid, .contact-wrap, .grid-3 {
        grid-template-columns: 1fr;
      }
      .hero { padding-top: 3rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <a href="#top" class="brand" id="brand">CHEYLA J TAVAREZ</a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main id="top">

    <!-- Hero -->
    <section id="sec-hero">
      <div class="container hero">
        <div>
          <span class="eyebrow" id="hero-eyebrow"></span>
          <h1 id="hero-headline"></h1>
          <p class="lead" id="hero-lead"></p>
          <div class="cta-row">
            <a class="btn btn-primary"   id="cta-primary"   href="#contact">Get in touch</a>
            <a class="btn btn-secondary" id="cta-secondary" href="#about">Learn more</a>
          </div>
        </div>
        <div id="hero-right"><!-- rendered by JS -->
        </div>
      </div>
    </section>

    <!-- Focus -->
    <section id="focus">
      <div class="container">
        <h2 class="section-title" id="focus-title"></h2>
        <p class="section-copy"   id="focus-intro"></p>
        <div class="grid-3" id="focus-cards"></div>
      </div>
    </section>

    <!-- About -->
    <section id="about">
      <div class="container about-grid">
        <div class="quote" id="about-quote"></div>
        <div>
          <h2 class="section-title" id="about-title"></h2>
          <p class="section-copy"   id="about-body"></p>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact">
      <div class="container">
        <h2 class="section-title" id="contact-title"></h2>
        <p class="section-copy"   id="contact-intro"></p>
        <div class="contact-wrap">
          <div class="card">
            <form id="contact-form">
              <input type="text"  name="name"    placeholder="Your name"    aria-label="Your name"    required />
              <input type="email" name="email"   placeholder="Your email"   aria-label="Your email"   required />
              <textarea           name="message" placeholder="Your message" aria-label="Your message" required></textarea>
              <button class="btn btn-primary" type="submit">Send message</button>
              <div id="form-status" class="form-status"></div>
            </form>
          </div>
          <div class="card">
            <h3>Direct details</h3>
            <p id="contact-details"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- Posts (hidden when empty) -->
    <section id="posts" style="display:none">
      <div class="container">
        <h2 class="section-title">Latest</h2>
        <div class="posts-grid" id="posts-grid"></div>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <div>© <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function set(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text || '';
    }

    function render(c) {
      // Meta
      if (c.meta) {
        document.getElementById('page-title').textContent = c.meta.title || '';
        document.getElementById('page-desc').content      = c.meta.description || '';
      }

      // Nav
      if (c.nav) {
        set('brand', c.nav.brand);
        document.getElementById('footer-name').textContent = c.nav.brand || '';
        document.getElementById('nav-links').innerHTML = (c.nav.links || [])
          .map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
      }

      // Hero
      if (c.hero) {
        set('hero-eyebrow',  c.hero.eyebrow);
        set('hero-headline', c.hero.headline);
        set('hero-lead',     c.hero.lead);
        const p = document.getElementById('cta-primary');
        const s = document.getElementById('cta-secondary');
        if (p && c.hero.cta_primary)   { p.textContent = c.hero.cta_primary.label;   p.href = c.hero.cta_primary.href || '#'; }
        if (s && c.hero.cta_secondary) { s.textContent = c.hero.cta_secondary.label; s.href = c.hero.cta_secondary.href || '#'; }

        // Right column: photo if uploaded, otherwise placeholder card
        const heroRight = document.getElementById('hero-right');
        if (heroRight) {
          if (c.hero.image) {
            heroRight.innerHTML = `
              <div class="hero-img-wrap">
                <img class="hero-img"
                     src="${esc(c.hero.image)}"
                     alt="${esc(c.nav?.brand || 'Cheyla J Tavarez')}"
                     loading="eager" />
              </div>`;
          } else {
            heroRight.innerHTML = `
              <div class="hero-card">
                <div class="hero-card-inner">
                  <strong>${esc(c.hero.card_title)}</strong>
                  <p>${esc(c.hero.card_body)}</p>
                </div>
              </div>`;
          }
        }
      }

      // Focus
      if (c.focus) {
        set('focus-title', c.focus.title);
        set('focus-intro', c.focus.intro);
        document.getElementById('focus-cards').innerHTML = (c.focus.cards || [])
          .map(card => `
            <article class="card">
              ${card.image ? `<img class="card-img" src="${esc(card.image)}" alt="${esc(card.title)}" loading="lazy" />` : ''}
              <h3>${esc(card.title)}</h3>
              <p>${esc(card.body)}</p>
            </article>`).join('');
      }

      // About
      if (c.about) {
        set('about-quote', c.about.quote);
        set('about-title', c.about.title);
        set('about-body',  c.about.body);
      }

      // Contact
      if (c.contact) {
        set('contact-title', c.contact.title);
        set('contact-intro', c.contact.intro);
        const details = [];
        if (c.contact.email)     details.push(`<p><strong>Email:</strong> ${esc(c.contact.email)}</p>`);
        if (c.contact.instagram) details.push(`<p><strong>Instagram:</strong> ${esc(c.contact.instagram)}</p>`);
        if (c.contact.location)  details.push(`<p><strong>Location:</strong> ${esc(c.contact.location)}</p>`);
        document.getElementById('contact-details').innerHTML =
          details.length ? details.join('') : '<p style="color:var(--muted)">Add your contact details in the CMS.</p>';
      }

      // Posts
      const posts = (c.posts || []).filter(p => p.published);
      if (posts.length) {
        document.getElementById('posts').style.display = '';
        document.getElementById('posts-grid').innerHTML = posts
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .map(post => `
            <article class="post-card">
              ${post.image ? `<img class="post-card-img" src="${esc(post.image)}" alt="${esc(post.title)}" loading="lazy" />` : ''}
              <div class="post-meta">
                <span>${esc(new Date(post.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }))}</span>
                ${post.category ? `<span class="post-category">${esc(post.category)}</span>` : ''}
              </div>
              <h3 class="post-title">${esc(post.title)}</h3>
              <p class="post-body">${esc(post.body)}</p>
              <div class="post-links">
                ${post.link      ? `<a class="post-link" href="${esc(post.link)}"      target="_blank" rel="noopener">Read more →</a>` : ''}
                ${post.video_url ? `<a class="post-link" href="${esc(post.video_url)}" target="_blank" rel="noopener">▶ Watch</a>`    : ''}
              </div>
            </article>`).join('');
      }

      // Contact form
      initContactForm(c.contact?.form_key || '');

      document.body.classList.add('ready');
    }

    function initContactForm(formKey) {
      const form   = document.getElementById('contact-form');
      const status = document.getElementById('form-status');
      if (!form) return;

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled    = true;
        btn.textContent = 'Sending…';
        status.className   = 'form-status';
        status.textContent = '';

        if (!formKey) {
          status.textContent = 'Contact form is not configured yet — please email directly.';
          status.className   = 'form-status error';
          btn.disabled    = false;
          btn.textContent = 'Send message';
          return;
        }

        try {
          const res = await fetch('https://api.web3forms.com/submit', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({
              access_key: formKey,
              name:       form.querySelector('[name="name"]').value,
              email:      form.querySelector('[name="email"]').value,
              message:    form.querySelector('[name="message"]').value,
              subject:    'New message from cheylajtavarez.com',
              from_name:  'Cheyla J Tavarez Website',
            }),
          });
          const result = await res.json();
          if (result.success) {
            status.textContent = '✓ Message sent! I\'ll get back to you soon.';
            status.className   = 'form-status success';
            form.reset();
          } else {
            throw new Error(result.message || 'Submission failed');
          }
        } catch {
          status.textContent = 'Something went wrong. Please try emailing directly.';
          status.className   = 'form-status error';
        } finally {
          btn.disabled    = false;
          btn.textContent = 'Send message';
        }
      });
    }

    fetch('/content.json')
      .then(r => r.json())
      .then(render)
      .catch(() => document.body.classList.add('ready'));
  </script>
</body>
</html>
